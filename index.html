<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Neha</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="background-hearts">
    <span>♥</span>
    <span>♥</span>
    <span>♥</span>
    <span>♥</span>
    <span>♥</span>
    <span>♥</span>
  </div>

  <div class="container">
    <header class="topbar">
      <div class="name-box">
        <label>From
          <input id="fromName" type="text" value="Adnan" />
        </label>
        <label>To
          <input id="toName" type="text" value="Neha" />
        </label>
      </div>

      <div class="top-actions">
        <button id="revealBtn">Reveal Love</button>
        <button id="editBtn" class="ghost">Edit</button>
        <button id="downloadBtn">Download</button>
      </div>
    </header>

    <main class="card">
      <div class="content">
        <div class="envelope-wrap">
          <div class="envelope" id="envelope" tabindex="0" aria-label="Open letter">
            <div class="envelope-top"></div>
            <div class="envelope-flap"></div>
            <div class="letter">
              <div class="letter-header">
                <span id="letterTo">My dearest Neha,</span>
              </div>

              <div class="letter-body" id="letterBody"></div>

              <div class="letter-footer">
                <span>With all my love,</span>
                <span id="letterFrom">Adnan</span>
              </div>
            </div>
          </div>
        </div>

        <section class="side-panel">
          <div class="photo-frame">
            <img
              src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=80"
              alt="Romantic couple"
            />
          </div>

          <div class="music-block">
            <button id="musicToggle">Play soft music</button>
          </div>
        </section>
      </div>
    </main>

    <aside class="editor-panel" id="editorPanel">
      <h2>Edit the letter</h2>
      <textarea id="letterEditor" rows="12"></textarea>
      <div class="editor-actions">
        <button id="saveBtn">Save</button>
        <button id="cancelBtn">Cancel</button>
      </div>
    </aside>

    <footer class="footer">
      A little apology. A lot of love. Always.
    </footer>
  </div>

  <audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_ceb47c0c82.mp3?filename=gentle-ambient-114463.mp3" type="audio/mpeg" />
  </audio>

  <script src="script.js"></script>
</body>
</html>
