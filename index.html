<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Neha</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="identity">
        <div class="name-display"><span class="label">From</span><strong id="staticFrom">Adnan</strong></div>
        <div class="name-display"><span class="label">To</span><strong id="staticTo">Neha</strong></div>
      </div>

      <div class="toolbar">
        <button id="revealBtn">Reveal My Heart</button>
        <button id="editBtn" class="soft">Edit</button>
        <button id="downloadBtn" class="violet">Download</button>
      </div>
    </header>

    <main class="main-card">
      <div class="story-grid">
        <section class="letter-area">
          <div class="envelope" id="envelope" tabindex="0" aria-label="Open letter">
            <div class="envelope-top"></div>
            <div class="envelope-flap"></div>

            <div class="letter">
              <div class="letter-head">
                <span id="letterTo">My dearest Neha,</span>
              </div>

              <div class="letter-body" id="letterBody"></div>

              <div class="letter-end">
                <span>Forever yours,</span>
                <strong id="letterFrom">Adnan</strong>
              </div>
            </div>
          </div>
        </section>

        <aside class="photo-panel">
          <div class="photo-box">
            <!-- Swans gallery -->
            <div id="gallery" class="gallery">
              <button id="prevPhoto" class="gallery-nav" aria-label="Previous photo">‹</button>
              <img id="galleryImage" src="https://cdn.pixabay.com/photo/2016/11/23/00/45/swan-1850154_1280.jpg" alt="Romantic swans">
              <button id="nextPhoto" class="gallery-nav" aria-label="Next photo">›</button>
              <div class="gallery-thumbs" id="galleryThumbs"></div>
            </div>
          </div>

          <div class="memory-card">
            <h3>Our Story</h3>
            <p>
              Every time I think about you, I remember the warmth, the peace, and the love that only you bring into my life.
            </p>
          </div>

          <div class="music-box">
            <button id="musicToggle">Play soft music</button>
          </div>
        </aside>
      </div>
    </main>

    <section class="editor-panel" id="editorPanel">
      <h2>Edit the letter</h2>
      <textarea id="letterEditor" rows="12"></textarea>
      <div class="editor-actions">
        <button id="saveBtn">Save</button>
        <button id="cancelBtn">Cancel</button>
      </div>
    </section>

    <footer class="footer">
      A little sorry. A lot of love. Always you.
    </footer>
  </div>

  <audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_ceb47c0c82.mp3?filename=gentle-ambient-114463.mp3" type="audio/mpeg" />
  </audio>

  <script src="script.js"></script>
</body>
</html>
